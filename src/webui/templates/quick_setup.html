{% extends "auth_base.html" %}

{% block title %}快速设置{% endblock %}

{% block header %}快速设置{% endblock %}
{% block subheader %}完成即可直接启动使用基础对话功能{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <form id="quickSetupForm" onsubmit="handleQuickSetup(event)">
        <div class="mb-2">
            <label for="botToken" class="form-label">
                Telegram Bot Token
                <span class="text-danger">*</span>
            </label>
            <input type="password" class="form-control" id="botToken"
                   placeholder="请输入 Bot Token，格式如：123456:ABC-DEF1234..."
                   autocomplete="new-password"
                   required>
            <small class="form-text text-muted">
                通过 <a href="https://t.me/BotFather" target="_blank" rel="noopener">@BotFather</a>
                创建 Bot 后获取 Token。请妥善保管，不要泄露给他人。
            </small>
        </div>

        <div class="mb-2">
            <label for="apiKey" class="form-label">
                API 密钥
                <span class="text-danger">*</span>
            </label>
            <input type="password" class="form-control" id="apiKey"
                   placeholder="请输入 API 密钥"
                   autocomplete="new-password"
                   required>
            <small class="form-text text-muted">
                还没有 API 密钥？<a href="https://api.kourichat.com/register" target="_blank" rel="noopener">点我获取</a>
            </small>
        </div>

        <div class="d-flex justify-content-between mb-2">
            <button type="button" class="btn btn-secondary" onclick="skipSetup()">跳过</button>
            <button type="submit" class="btn btn-primary">保存设置</button>
        </div>
    </form>
</div>

<!-- 错误提示框 -->
<div id="errorAlert" class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;">
    <span id="errorMessage"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endblock %}

{% block extra_script %}
<script>
    function handleQuickSetup(event) {
        event.preventDefault();

        const botToken = document.getElementById('botToken').value.trim();
        const apiKey   = document.getElementById('apiKey').value.trim();

        if (!botToken) {
            showError('请输入 Telegram Bot Token');
            return;
        }
        if (!apiKey) {
            showError('请输入 API 密钥');
            return;
        }

        // 简单格式校验：Token 格式为 <数字>:<字符串>
        if (!/^\d+:[A-Za-z0-9_\-]+$/.test(botToken)) {
            showError('Bot Token 格式不正确，请检查后重新输入');
            return;
        }

        fetch('/save_quick_setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                bot_token: botToken,
                api_key:   apiKey
            })
        })
        .then(response => {
            if (!response.ok) throw new Error('网络响应不正常');
            return response.json();
        })
        .then(data => {
            if (data.status === 'success') {
                const successMessage = document.createElement('div');
                successMessage.className = 'alert alert-success';
                successMessage.textContent = '设置已保存，即将跳转到仪表盘...';
                document.querySelector('.auth-wrapper').appendChild(successMessage);
                setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
            } else {
                showError(data.message || '保存设置失败');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showError('保存失败：' + (error.message || '网络错误，请重试'));
        });
    }

    function skipSetup() {
        window.location.href = '/dashboard';
    }

    function showError(message) {
        const alertEl = document.getElementById('errorAlert');
        const msgEl   = document.getElementById('errorMessage');
        if (alertEl && msgEl) {
            msgEl.textContent = message;
            alertEl.style.display = 'block';
            setTimeout(() => { alertEl.style.display = 'none'; }, 3000);
        } else {
            alert(message);
        }
    }
</script>
{% endblock %}
