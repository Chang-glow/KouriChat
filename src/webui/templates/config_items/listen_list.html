<!-- Telegram Chat ID 列表配置 -->
<!-- 说明：填入需要 Bot 响应的 Telegram chat_id（私聊用户 ID 或群聊负数 ID） -->
<div class="mb-2">
    <div class="input-group mb-2">
        <input type="text" class="form-control"
            id="input_{{ key }}"
            placeholder="请输入 Telegram Chat ID（如：123456789 或 -1001234567890）">
        <button class="btn btn-primary" type="button"
            onclick="addNewUser('{{ key }}')"
            title="添加 Chat ID">
            添加 <i class="bi bi-plus-lg"></i>
        </button>
    </div>
    <div class="form-text mb-2">
        <i class="bi bi-info-circle me-1"></i>
        私聊 Chat ID 为正整数，群聊 Chat ID 为负整数（如 <code>-1001234567890</code>）。
        可通过 <a href="https://t.me/userinfobot" target="_blank" rel="noopener">@userinfobot</a> 查询自己的 ID，
        或将 Bot 添加至群聊后发送消息，在 Bot 日志中查看群聊 ID。
    </div>
    <div id="selected_users_{{ key }}" class="list-group">
        {% if config.value %}
            {% for chat_id in config.value %}
                {% if chat_id %}
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        {{ chat_id }}
                        <button type="button" class="btn btn-danger btn-sm"
                                onclick="removeUser('{{ key }}', '{{ chat_id }}')"
                                title="删除 Chat ID">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                {% endif %}
            {% endfor %}
        {% endif %}
    </div>
</div>
<!-- 隐藏字段，存储逗号分隔的 chat_id 列表，供后端读取 -->
<input type="text" class="form-control"
    id="{{ key }}" name="{{ key }}"
    value="{{ config.value|join(',') }}"
    placeholder="多个值用英文逗号分隔"
    readonly
    style="display: none;">
